<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Семейный бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 40px;
  }

  h1 { font-size: 22px; margin: 4px 0 16px; }
  h3 { margin: 0 0 12px; font-size: 17px; }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 14px;
  }

  .balance-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    font-size: 15px;
  }

  .total { font-size: 26px; font-weight: 800; margin-top: 4px; }
  .green { color: #2e7d32; }
  .red { color: #c62828; }

  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin: 12px 0 6px;
  }

  input, select, textarea {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--hint);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }

  textarea { resize: vertical; min-height: 60px; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 11px;
    border-radius: 12px;
    background: var(--bg);
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
  }

  .tab.active {
    background: var(--button);
    color: var(--button-text);
  }

  .btn {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: var(--button);
    color: var(--button-text);
    font-size: 16px;
    font-weight: 700;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(128,128,128,.18);
  }

  .stat-row:last-child { border-bottom: 0; }

  .muted {
    color: var(--hint);
    font-size: 12px;
    margin-top: 3px;
  }

  .empty {
    color: var(--hint);
    font-size: 14px;
    text-align: center;
    padding: 12px 0;
  }

  .chart-wrap {
    position: relative;
    height: 280px;
  }

  .op-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(128,128,128,.18);
  }

  .op-row:last-child { border-bottom: 0; }

  .amount { white-space: nowrap; font-weight: 700; }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .filters select { font-size: 14px; padding: 9px; }
</style>
</head>
<body>

<h1>Семейный бюджет</h1>

<div class="card">
  <div class="balance-row"><span>Доходы</span><b id="incomeTotal" class="green">0 ₽</b></div>
  <div class="balance-row"><span>Расходы</span><b id="expenseTotal" class="red">0 ₽</b></div>
  <div class="balance-row"><span>Остаток</span><b id="balanceTotal">0 ₽</b></div>
  <div class="total" id="balanceBig">0 ₽</div>
</div>

<div class="card">
  <div class="tabs">
    <div class="tab active" data-type="expense">Расход</div>
    <div class="tab" data-type="income">Доход</div>
  </div>

  <label>Кто добавил</label>
  <select id="member">
    <option value="Муж">Муж</option>
    <option value="Жена">Жена</option>
  </select>

  <label>Категория</label>
  <select id="category"></select>

  <label>Сумма, ₽</label>
  <input id="amount" type="number" inputmode="decimal" min="1" step="0.01" placeholder="Например, 1500">

  <label>Комментарий</label>
  <textarea id="comment" placeholder="Например: продукты в Пятёрочке"></textarea>

  <button class="btn" onclick="saveOperation()">Добавить</button>
</div>

<div class="card">
  <h3>Общая диаграмма</h3>
  <div class="chart-wrap">
    <canvas id="mainChart"></canvas>
  </div>
</div>

<div class="card">
  <h3>Расходы по категориям</h3>
  <div id="expenseStats"></div>
</div>

<div class="card">
  <h3>Доходы по категориям</h3>
  <div id="incomeStats"></div>
</div>

<div class="card">
  <h3>По участникам</h3>
  <div id="memberStats"></div>
</div>

<div class="card">
  <h3>История операций</h3>

  <div class="filters">
    <select id="filterMember" onchange="renderHistory()">
      <option value="">Все участники</option>
      <option value="Муж">Муж</option>
      <option value="Жена">Жена</option>
    </select>

    <select id="filterType" onchange="renderHistory()">
      <option value="">Доходы и расходы</option>
      <option value="income">Только доходы</option>
      <option value="expense">Только расходы</option>
    </select>
  </div>

  <div id="operations"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.setHeaderColor?.("bg_color");
tg.setBackgroundColor?.("bg_color");

const STORAGE_KEY = "family_finance_operations_v1";

const expenseCategories = [
  "Продукты", "Кафе и рестораны", "Доставка еды", "Жильё и аренда",
  "Коммунальные услуги", "Интернет и связь", "Мобильная связь",
  "Транспорт", "Бензин", "Такси", "Авто: обслуживание", "Авто: страховка",
  "Одежда", "Обувь", "Красота и уход", "Парикмахерская", "Косметика",
  "Здоровье", "Лекарства", "Стоматология", "Спорт и фитнес",
  "Образование", "Курсы", "Дети", "Детский сад", "Школа",
  "Игрушки", "Детская одежда", "Подарки", "Цветы",
  "Развлечения", "Кино", "Концерты", "Игры", "Путешествия", "Отпуск",
  "Отели", "Билеты", "Подписки", "Техника", "Электроника",
  "Дом и ремонт", "Мебель", "Бытовая техника", "Хозяйственные товары",
  "Питомцы", "Кредиты", "Рассрочка", "Налоги", "Страхование",
  "Сбережения", "Инвестиции", "Благотворительность", "Прочее"
];

const incomeCategories = [
  "Зарплата мужа", "Зарплата жены", "Аванс", "Премия", "Подработка",
  "Фриланс", "Бизнес", "Продажа вещей", "Аренда", "Проценты по вкладу",
  "Дивиденды", "Инвестиции", "Кэшбэк", "Подарки", "Возврат налога",
  "Социальные выплаты", "Пособия", "Стипендия", "Пенсия", "Прочий доход"
];

let currentType = "expense";
let mainChart = null;

function getOperations() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveOperations(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function money(value) {
  return Number(value || 0).toLocaleString("ru-RU", {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  }) + " ₽";
}

function fillCategories() {
  const select = document.getElementById("category");
  const list = currentType === "expense" ? expenseCategories : incomeCategories;

  select.innerHTML = list
    .map(category => `<option value="${category}">${category}</option>`)
    .join("");
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(item => item.classList.remove("active"));
    tab.classList.add("active");
    currentType = tab.dataset.type;
    fillCategories();
  });
});

function saveOperation() {
  const member = document.getElementById("member").value;
  const category = document.getElementById("category").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const comment = document.getElementById("comment").value.trim();

  if (!amount || amount <= 0) {
    tg.showAlert("Введите сумму больше нуля");
    return;
  }

  const operations = getOperations();

  operations.unshift({
    id: Date.now(),
    member,
    type: currentType,
    category,
    amount,
    comment,
    created_at: new Date().toISOString()
  });

  saveOperations(operations);

  document.getElementById("amount").value = "";
  document.getElementById("comment").value = "";

  tg.HapticFeedback?.impactOccurred("medium");
  tg.showAlert(currentType === "income" ? "Доход добавлен" : "Расход добавлен");

  renderAll();
}

function calculateCategoryStats(operations, type) {
  const grouped = {};

  operations
    .filter(operation => operation.type === type)
    .forEach(operation => {
      if (!grouped[operation.category]) {
        grouped[operation.category] = {
          category: operation.category,
          total: 0,
          count: 0
        };
      }

      grouped[operation.category].total += Number(operation.amount);
      grouped[operation.category].count += 1;
    });

  const items = Object.values(grouped).sort((a, b) => b.total - a.total);
  const total = items.reduce((sum, item) => sum + item.total, 0);

  return items.map(item => ({
    ...item,
    share: total ? Math.round(item.total / total * 1000) / 10 : 0
  }));
}

function renderStats(containerId, items) {
  const container = document.getElementById(containerId);

  if (!items.length) {
    container.innerHTML = `<div class="empty">Пока нет данных</div>`;
    return;
  }

  container.innerHTML = items.map(item => `
    <div class="stat-row">
      <div>
        <div>${item.category}</div>
        <div class="muted">${item.count} операций · ${item.share}%</div>
      </div>
      <div class="amount">${money(item.total)}</div>
    </div>
  `).join("");
}

function renderMemberStats(operations) {
  const container = document.getElementById("memberStats");
  const members = ["Муж", "Жена"];

  container.innerHTML = members.map(member => {
    const income = operations
      .filter(operation => operation.member === member && operation.type === "income")
      .reduce((sum, operation) => sum + Number(operation.amount), 0);

    const expense = operations
      .filter(operation => operation.member === member && operation.type === "expense")
      .reduce((sum, operation) => sum + Number(operation.amount), 0);

    return `
      <div class="stat-row">
        <div>
          <div>${member}</div>
          <div class="muted">Доход: ${money(income)} · Расход: ${money(expense)}</div>
        </div>
        <div class="amount ${income - expense >= 0 ? "green" : "red"}">
          ${money(income - expense)}
        </div>
      </div>
    `;
  }).join("");
}

function renderChart(operations) {
  const expenseStats = calculateCategoryStats(operations, "expense");
  const incomeStats = calculateCategoryStats(operations, "income");

  const labels = [
    ...expenseStats.map(item => "Расход: " + item.category),
    ...incomeStats.map(item => "Доход: " + item.category)
  ];

  const values = [
    ...expenseStats.map(item => item.total),
    ...incomeStats.map(item => item.total)
  ];

  const colors = [
    "#ff6384", "#36a2eb", "#ffce56", "#4bc0c0", "#9966ff",
    "#ff9f40", "#8ac24a", "#ea5532", "#00acc1", "#5c6bc0",
    "#d81b60", "#43a047", "#fb8c00", "#3949ab", "#00897b"
  ];

  const context = document.getElementById("mainChart");

  if (mainChart) {
    mainChart.destroy();
  }

  mainChart = new Chart(context, {
    type: "doughnut",
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: labels.map((_, index) => colors[index % colors.length]),
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            boxWidth: 12,
            padding: 10,
            font: { size: 11 }
          }
        }
      }
    }
  });
}

function renderHistory() {
  const operations = getOperations();
  const memberFilter = document.getElementById("filterMember").value;
  const typeFilter = document.getElementById("filterType").value;

  const filtered = operations.filter(operation => {
    return (!memberFilter || operation.member === memberFilter) &&
           (!typeFilter || operation.type === typeFilter);
  });

  const container = document.getElementById("operations");

  if (!filtered.length) {
    container.innerHTML = `<div class="empty">Операций пока нет</div>`;
    return;
  }

  container.innerHTML = filtered.slice(0, 50).map(operation => {
    const date = new Date(operation.created_at);
    const formattedDate = date.toLocaleDateString("ru-RU") + " " +
      date.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

    return `
      <div class="op-row">
        <div>
          <div>${operation.category} · ${operation.member}</div>
          <div class="muted">
            ${operation.comment || "Без комментария"} · ${formattedDate}
          </div>
        </div>
        <div class="amount ${operation.type === "income" ? "green" : "red"}">
          ${operation.type === "income" ? "+" : "−"}${money(operation.amount)}
        </div>
      </div>
    `;
  }).join("");
}

function renderAll() {
  const operations = getOperations();

  const incomeTotal = operations
    .filter(operation => operation.type === "income")
    .reduce((sum, operation) => sum + Number(operation.amount), 0);

  const expenseTotal = operations
    .filter(operation => operation.type === "expense")
    .reduce((sum, operation) => sum + Number(operation.amount), 0);

  const balance = incomeTotal - expenseTotal;

  document.getElementById("incomeTotal").textContent = money(incomeTotal);
  document.getElementById("expenseTotal").textContent = money(expenseTotal);
  document.getElementById("balanceTotal").textContent = money(balance);
  document.getElementById("balanceBig").textContent = money(balance);
  document.getElementById("balanceBig").className = "total " + (balance >= 0 ? "green" : "red");

  renderStats("expenseStats", calculateCategoryStats(operations, "expense"));
  renderStats("incomeStats", calculateCategoryStats(operations, "income"));
  renderMemberStats(operations);
  renderChart(operations);
  renderHistory();
}

fillCategories();
renderAll();
</script>

</body>
</html>
