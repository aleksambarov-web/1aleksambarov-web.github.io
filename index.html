<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой бюджет</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root,
  :root[data-theme="light"] {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #eef1f5;
    --text: #1f2937;
    --text-secondary: #4b5563;
    --muted: #6b7280;
    --border: #d7dce3;
    --primary: #3b6ea5;
    --primary-soft: #e5eef7;
    --income: #2f7d5c;
    --income-soft: #e6f3ed;
    --expense: #b4553f;
    --expense-soft: #f8ece8;
    --danger: #b3423b;
    --shadow: 0 4px 16px rgba(31, 41, 55, .06);
    --radius: 18px;
  }

  :root[data-theme="dark"] {
    --bg: #121417;
    --surface: #1b1f24;
    --surface-2: #23282e;
    --text: #f3f4f6;
    --text-secondary: #d1d5db;
    --muted: #9ca3af;
    --border: #333a42;
    --primary: #7ea8d4;
    --primary-soft: #22303d;
    --income: #7fc8a4;
    --income-soft: #1e2b25;
    --expense: #e39a86;
    --expense-soft: #33241f;
    --danger: #e08a80;
    --shadow: 0 4px 16px rgba(0, 0, 0, .25);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.45;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 16px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .app-title {
    font-size: 21px;
    font-weight: 800;
  }

  .app-subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 3px;
  }

  .header-icon {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: var(--primary-soft);
    border-radius: 15px;
    font-size: 21px;
  }

  .balance-card {
    margin: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }

  .balance-label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  .balance-value {
    font-size: 32px;
    font-weight: 800;
    margin-top: 4px;
  }

  .mini-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }

  .mini-stat {
    background: var(--surface-2);
    border-radius: 15px;
    padding: 12px;
  }

  .mini-stat-title {
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mini-stat-value {
    font-size: 18px;
    font-weight: 800;
    margin-top: 5px;
  }

  .app {
    padding: 0 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 14px;
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 14px;
  }

  label {
    display: block;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 700;
    margin: 14px 0 7px;
  }

  input, select, textarea {
    width: 100%;
    min-height: 56px;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  input::placeholder, textarea::placeholder {
    color: var(--muted);
    font-weight: 500;
    opacity: 1;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }

  textarea {
    resize: vertical;
    min-height: 78px;
  }

  .btn {
    width: 100%;
    min-height: 56px;
    margin-top: 16px;
    padding: 15px;
    border: 0;
    border-radius: 16px;
    background: var(--primary);
    color: #ffffff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: transform .12s ease, filter .15s ease;
  }

  .btn:active {
    transform: scale(.98);
    filter: brightness(.95);
  }

  .btn.secondary {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn.danger {
    background: var(--expense-soft);
    color: var(--expense);
  }

  .tabs-main {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 5px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 7px;
    z-index: 30;
  }

  .tab-main {
    flex: 1;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border-radius: 16px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }

  .tab-main.active {
    background: var(--primary-soft);
    color: var(--primary);
  }

  .tab-main span {
    font-size: 20px;
  }

  .page {
    display: none;
    animation: fadeIn .16s ease;
  }

  .page.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .type-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }

  .type-tab {
    flex: 1;
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: var(--surface-2);
    color: var(--text-secondary);
    font-weight: 800;
    cursor: pointer;
    transition: all .15s ease;
  }

  .type-tab.active-income {
    background: var(--income-soft);
    border-color: var(--income);
    color: var(--income);
  }

  .type-tab.active-expense {
    background: var(--expense-soft);
    border-color: var(--expense);
    color: var(--expense);
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
  }

  .stat-row:last-child {
    border-bottom: 0;
  }

  .stat-name {
    display: flex;
    align-items: center;
    gap: 11px;
    font-weight: 700;
  }

  .stat-icon {
    width: 42px;
    height: 42px;
    min-width: 42px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: var(--surface-2);
    font-size: 19px;
  }

  .progress {
    height: 7px;
    background: var(--surface-2);
    border-radius: 999px;
    margin-top: 8px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    border-radius: 999px;
    background: var(--primary);
  }

  .amount {
    white-space: nowrap;
    font-weight: 800;
  }

  .green { color: var(--income); }
  .red { color: var(--expense); }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 20px 0;
    font-size: 15px;
  }

  .chart-wrap {
    position: relative;
    height: 300px;
  }

  .history-filters {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }

  .history-filters select {
    min-height: 52px;
    font-size: 16px;
  }

  .op-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
  }

  .op-row:last-child {
    border-bottom: 0;
  }

  .op-title {
    font-weight: 800;
  }

  .op-comment {
    color: var(--muted);
    font-size: 13px;
    margin-top: 3px;
  }

  .delete-btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--danger);
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 14px;
    font-size: 16px;
    cursor: pointer;
  }

  @media (max-width: 360px) {
    .balance-card, .app { margin-left: 12px; margin-right: 12px; padding-left: 0; padding-right: 0; }
    .balance-value { font-size: 29px; }
    input, select, textarea { font-size: 16px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-top">
    <div>
      <div class="app-title">Мой бюджет</div>
      <div class="app-subtitle">Пополнения, расходы и статистика</div>
    </div>
    <div class="header-icon">💰</div>
  </div>
</header>

<div class="balance-card">
  <div class="balance-label">Доступно сейчас</div>
  <div class="balance-value" id="balanceBig">0 ₽</div>

  <div class="mini-stats">
    <div class="mini-stat">
      <div class="mini-stat-title">📈 Пополнения</div>
      <div class="mini-stat-value green" id="incomeTotal">0 ₽</div>
    </div>

    <div class="mini-stat">
      <div class="mini-stat-title">📉 Расходы</div>
      <div class="mini-stat-value red" id="expenseTotal">0 ₽</div>
    </div>
  </div>
</div>

<main class="app">

  <section class="page active" id="page-dashboard">
    <div class="card">
      <div class="card-title">🥧 Общая диаграмма</div>
      <div class="chart-wrap">
        <canvas id="mainChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🕘 Последние операции</div>
      <div id="recentOperations"></div>
    </div>
  </section>

  <section class="page" id="page-add">
    <div class="card">
      <div class="card-title">➕ Новая операция</div>

      <div class="type-tabs">
        <button class="type-tab active-expense" data-type="expense" type="button">
          💸 Расход
        </button>

        <button class="type-tab" data-type="income" type="button">
          💰 Пополнение
        </button>
      </div>

      <label for="category">Категория</label>
      <select id="category"></select>

      <label for="amount">Сумма, ₽</label>
      <input id="amount" type="number" inputmode="decimal" min="1" step="0.01" placeholder="Например, 1500">

      <label for="comment">Комментарий</label>
      <textarea id="comment" placeholder="Например: продукты в Пятёрочке"></textarea>

      <button class="btn" type="button" onclick="saveOperation()">
        💾 Сохранить операцию
      </button>

      <button class="btn secondary" type="button" onclick="clearForm()">
        🧹 Очистить форму
      </button>
    </div>
  </section>

  <section class="page" id="page-history">
    <div class="card">
      <div class="card-title">📚 История операций</div>

      <div class="history-filters">
        <label for="filterType">Тип операции</label>
        <select id="filterType" onchange="renderHistory()">
          <option value="">Все операции</option>
          <option value="income">Только пополнения</option>
          <option value="expense">Только расходы</option>
        </select>

        <label for="filterCategory">Категория</label>
        <select id="filterCategory" onchange="renderHistory()">
          <option value="">Все категории</option>
        </select>
      </div>

      <div id="historyOperations"></div>
    </div>
  </section>

  <section class="page" id="page-stats">
    <div class="card">
      <div class="card-title">📉 Расходы по категориям</div>
      <div id="expenseStats"></div>
    </div>

    <div class="card">
      <div class="card-title">📈 Пополнения по категориям</div>
      <div id="incomeStats"></div>
    </div>
  </section>

</main>

<nav class="tabs-main">
  <button class="tab-main active" data-page="page-dashboard" type="button">
    <span>🏠</span>
    Главная
  </button>

  <button class="tab-main" data-page="page-add" type="button">
    <span>➕</span>
    Добавить
  </button>

  <button class="tab-main" data-page="page-history" type="button">
    <span>📚</span>
    История
  </button>

  <button class="tab-main" data-page="page-stats" type="button">
    <span>📊</span>
    Статистика
  </button>
</nav>

<script>
"use strict";

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

function applyTheme() {
  let scheme = "light";

  try {
    if (tg && (tg.colorScheme === "dark" || tg.colorScheme === "light")) {
      scheme = tg.colorScheme;
    } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      scheme = "dark";
    }
  } catch {}

  document.documentElement.dataset.theme = scheme;
}

applyTheme();

try {
  if (tg) {
    tg.ready();
    tg.expand();

    if (tg.onEvent) {
      tg.onEvent("themeChanged", () => {
        applyTheme();
        renderAll();
      });
    }
  }
} catch (error) {
  console.warn("Telegram WebApp API недоступен:", error);
}

const OPERATIONS_KEY = "my_finance_operations_v4";

const expenseCategories = [
  { name: "Продукты", icon: "🛒" },
  { name: "Кафе и рестораны", icon: "🍽️" },
  { name: "Доставка еды", icon: "🛵" },
  { name: "Жильё и аренда", icon: "🏠" },
  { name: "Коммунальные услуги", icon: "💡" },
  { name: "Интернет и связь", icon: "🌐" },
  { name: "Мобильная связь", icon: "📱" },
  { name: "Транспорт", icon: "🚌" },
  { name: "Бензин", icon: "⛽" },
  { name: "Такси", icon: "🚕" },
  { name: "Авто: обслуживание", icon: "🔧" },
  { name: "Авто: страховка", icon: "🛡️" },
  { name: "Одежда", icon: "👕" },
  { name: "Обувь", icon: "👟" },
  { name: "Красота и уход", icon: "💅" },
  { name: "Парикмахерская", icon: "💈" },
  { name: "Косметика", icon: "💄" },
  { name: "Здоровье", icon: "🩺" },
  { name: "Лекарства", icon: "💊" },
  { name: "Стоматология", icon: "🦷" },
  { name: "Спорт и фитнес", icon: "🏋️" },
  { name: "Образование", icon: "🎓" },
  { name: "Курсы", icon: "📚" },
  { name: "Подарки", icon: "🎁" },
  { name: "Цветы", icon: "💐" },
  { name: "Развлечения", icon: "🎉" },
  { name: "Кино", icon: "🎬" },
  { name: "Концерты", icon: "🎤" },
  { name: "Игры", icon: "🎮" },
  { name: "Путешествия", icon: "✈️" },
  { name: "Отпуск", icon: "🏖️" },
  { name: "Отели", icon: "🏨" },
  { name: "Билеты", icon: "🎫" },
  { name: "Подписки", icon: "🔁" },
  { name: "Техника", icon: "💻" },
  { name: "Электроника", icon: "🔌" },
  { name: "Дом и ремонт", icon: "🛠️" },
  { name: "Мебель", icon: "🛋️" },
  { name: "Бытовая техника", icon: "🧺" },
  { name: "Хозяйственные товары", icon: "🧽" },
  { name: "Питомцы", icon: "🐾" },
  { name: "Кредиты", icon: "🏦" },
  { name: "Рассрочка", icon: "💳" },
  { name: "Налоги", icon: "🧾" },
  { name: "Страхование", icon: "📜" },
  { name: "Сбережения", icon: "🐖" },
  { name: "Инвестиции", icon: "📈" },
  { name: "Благотворительность", icon: "❤️" },
  { name: "Прочее", icon: "📦" }
];

const incomeCategories = [
  { name: "Зарплата", icon: "💼" },
  { name: "Аванс", icon: "💵" },
  { name: "Премия", icon: "🏆" },
  { name: "Подработка", icon: "🧰" },
  { name: "Фриланс", icon: "🖥️" },
  { name: "Бизнес", icon: "🏢" },
  { name: "Продажа вещей", icon: "🏷️" },
  { name: "Аренда", icon: "🔑" },
  { name: "Проценты по вкладу", icon: "🏦" },
  { name: "Дивиденды", icon: "📊" },
  { name: "Инвестиции", icon: "📈" },
  { name: "Кэшбэк", icon: "💳" },
  { name: "Подарки", icon: "🎁" },
  { name: "Возврат налога", icon: "🧾" },
  { name: "Социальные выплаты", icon: "🤝" },
  { name: "Пособия", icon: "👶" },
  { name: "Стипендия", icon: "🎓" },
  { name: "Пенсия", icon: "👵" },
  { name: "Прочий доход", icon: "✨" }
];

let currentType = "expense";
let mainChart = null;

function cssVar(name) {
  return getComputedStyle(document.documentElement)
    .getPropertyValue(name)
    .trim();
}

function isValidOperation(operation) {
  return Boolean(
    operation &&
    typeof operation === "object" &&
    (operation.type === "income" || operation.type === "expense") &&
    typeof operation.category === "string" &&
    operation.category.trim() &&
    Number.isFinite(Number(operation.amount)) &&
    Number(operation.amount) > 0
  );
}

function getOperations() {
  try {
    const raw = localStorage.getItem(OPERATIONS_KEY);

    if (!raw) {
      return [];
    }

    const parsed = JSON.parse(raw);

    if (!Array.isArray(parsed)) {
      return [];
    }

    return parsed.filter(isValidOperation);
  } catch (error) {
    console.error("Не удалось прочитать локальные данные:", error);
    return [];
  }
}

function saveOperations(operations) {
  try {
    localStorage.setItem(OPERATIONS_KEY, JSON.stringify(operations));
    return true;
  } catch (error) {
    console.error("Не удалось сохранить данные:", error);
    showAlert("Не удалось сохранить данные. Проверьте доступ к хранилищу браузера.");
    return false;
  }
}

function getCategory(categoryName) {
  return (
    expenseCategories.find(item => item.name === categoryName) ||
    incomeCategories.find(item => item.name === categoryName) ||
    { name: categoryName, icon: "📦" }
  );
}

function money(value) {
  return Number(value || 0).toLocaleString("ru-RU", {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  }) + " ₽";
}

function showAlert(message) {
  try {
    if (tg && tg.showAlert) {
      tg.showAlert(message);
    } else {
      alert(message);
    }
  } catch {
    alert(message);
  }
}

function haptic(type = "light") {
  try {
    if (!tg || !tg.HapticFeedback) return;

    if (type === "success") {
      tg.HapticFeedback.notificationOccurred("success");
    } else if (type === "error") {
      tg.HapticFeedback.notificationOccurred("error");
    } else if (type === "select") {
      tg.HapticFeedback.selectionChanged();
    } else {
      tg.HapticFeedback.impactOccurred(type);
    }
  } catch {
    // Виброотклик не критичен
  }
}

function fillCategories() {
  const select = document.getElementById("category");
  const list = currentType === "expense" ? expenseCategories : incomeCategories;

  select.innerHTML = list.map(item => {
    return `<option value="${item.name}">${item.icon} ${item.name}</option>`;
  }).join("");
}

function fillHistoryCategories() {
  const select = document.getElementById("filterCategory");
  const selectedValue = select.value;
  const allCategories = [...expenseCategories, ...incomeCategories];

  select.innerHTML =
    `<option value="">Все категории</option>` +
    allCategories.map(item => {
      return `<option value="${item.name}">${item.icon} ${item.name}</option>`;
    }).join("");

  select.value = selectedValue;
}

document.querySelectorAll(".type-tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".type-tab").forEach(item => {
      item.classList.remove("active-income", "active-expense");
    });

    currentType = button.dataset.type;

    button.classList.add(
      currentType === "expense" ? "active-expense" : "active-income"
    );

    fillCategories();
    haptic("select");
  });
});

document.querySelectorAll(".tab-main").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab-main").forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");

    document.querySelectorAll(".page").forEach(page => {
      page.classList.remove("active");
    });

    document.getElementById(button.dataset.page).classList.add("active");

    window.scrollTo({ top: 0, behavior: "smooth" });
    haptic("select");
  });
});

function clearForm() {
  document.getElementById("amount").value = "";
  document.getElementById("comment").value = "";
}

function saveOperation() {
  const category = document.getElementById("category").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const comment = document.getElementById("comment").value.trim();

  if (!category) {
    haptic("error");
    showAlert("Выберите категорию");
    return;
  }

  if (!Number.isFinite(amount) || amount <= 0) {
    haptic("error");
    showAlert("Введите сумму больше нуля");
    return;
  }

  const operations = getOperations();

  operations.unshift({
    id: Date.now() + "-" + Math.random().toString(16).slice(2),
    type: currentType,
    category,
    amount,
    comment,
    created_at: new Date().toISOString()
  });

  const saved = saveOperations(operations);

  if (!saved) {
    return;
  }

  clearForm();
  renderAll();

  haptic("success");
  showAlert(
    currentType === "income"
      ? "Пополнение сохранено ✅"
      : "Расход сохранён ✅"
  );
}

function deleteOperation(id) {
  const operations = getOperations().filter(operation => operation.id !== id);

  if (saveOperations(operations)) {
    renderAll();
    haptic("light");
  }
}

function calculateCategoryStats(operations, type) {
  const grouped = {};

  operations
    .filter(operation => operation.type === type)
    .forEach(operation => {
      const key = operation.category;

      if (!grouped[key]) {
        grouped[key] = {
          category: key,
          total: 0,
          count: 0
        };
      }

      grouped[key].total += Number(operation.amount);
      grouped[key].count += 1;
    });

  const items = Object.values(grouped).sort((a, b) => b.total - a.total);
  const total = items.reduce((sum, item) => sum + item.total, 0);

  return items.map(item => ({
    ...item,
    share: total ? Math.round(item.total / total * 1000) / 10 : 0
  }));
}

function renderStats(containerId, items) {
  const container = document.getElementById(containerId);

  if (!items.length) {
    container.innerHTML = `<div class="empty">Пока нет данных 📭</div>`;
    return;
  }

  const max = items[0].total;

  container.innerHTML = items.map(item => {
    const category = getCategory(item.category);
    const width = max ? Math.round(item.total / max * 100) : 0;

    return `
      <div class="stat-row">
        <div style="flex:1">
          <div class="stat-name">
            <div class="stat-icon">${category.icon}</div>
            <div>
              ${category.name}
              <div class="op-comment">${item.count} операций · ${item.share}%</div>
              <div class="progress">
                <div class="progress-bar" style="width:${width}%"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="amount">${money(item.total)}</div>
      </div>
    `;
  }).join("");
}

function renderChart(operations) {
  const expenseStats = calculateCategoryStats(operations, "expense");
  const incomeStats = calculateCategoryStats(operations, "income");

  const labels = [
    ...expenseStats.map(item => getCategory(item.category).icon + " " + item.category),
    ...incomeStats.map(item => getCategory(item.category).icon + " " + item.category)
  ];

  const values = [
    ...expenseStats.map(item => item.total),
    ...incomeStats.map(item => item.total)
  ];

  const colors = [
    "#7f9cb5", "#8fae91", "#b39a86", "#8d89b8", "#a3aebc",
    "#7fa7a0", "#b58f9d", "#96a97f", "#b0a184", "#7f8fa6"
  ];

  const context = document.getElementById("mainChart");

  if (mainChart) {
    mainChart.destroy();
    mainChart = null;
  }

  if (!labels.length) {
    return;
  }

  const legendColor = cssVar("--text-secondary") || "#4b5563";
  const tooltipBg = cssVar("--surface-2") || "#23282e";
  const tooltipTitle = cssVar("--text") || "#f3f4f6";
  const tooltipBody = cssVar("--text-secondary") || "#d1d5db";
  const tooltipBorder = cssVar("--border") || "#333a42";

  mainChart = new Chart(context, {
    type: "doughnut",
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: labels.map((_, index) => colors[index % colors.length]),
        borderWidth: 0,
        hoverOffset: 6
      }]
    },
    options: {
      cutout: "64%",
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            boxWidth: 10,
            padding: 9,
            color: legendColor,
            font: { size: 11 }
          }
        },
        tooltip: {
          backgroundColor: tooltipBg,
          titleColor: tooltipTitle,
          bodyColor: tooltipBody,
          borderColor: tooltipBorder,
          borderWidth: 1
        }
      }
    }
  });
}

function formatDate(value) {
  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "Дата неизвестна";
  }

  return date.toLocaleDateString("ru-RU") + ", " +
    date.toLocaleTimeString("ru-RU", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

function operationRow(operation, canDelete = false) {
  const category = getCategory(operation.category);
  const isIncome = operation.type === "income";

  return `
    <div class="op-row">
      <div style="display:flex;align-items:center;gap:11px;flex:1">
        <div class="stat-icon">${category.icon}</div>

        <div>
          <div class="op-title">${category.name}</div>
          <div class="op-comment">
            ${operation.comment || "Без комментария"} · ${formatDate(operation.created_at)}
          </div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:8px">
        <div class="amount ${isIncome ? "green" : "red"}">
          ${isIncome ? "+" : "−"}${money(operation.amount)}
        </div>

        ${canDelete ? `
          <button class="delete-btn" type="button" onclick="deleteOperation('${operation.id}')">
            🗑️
          </button>
        ` : ""}
      </div>
    </div>
  `;
}

function renderHistory() {
  const operations = getOperations();
  const typeFilter = document.getElementById("filterType").value;
  const categoryFilter = document.getElementById("filterCategory").value;

  const filtered = operations.filter(operation => {
    return (!typeFilter || operation.type === typeFilter) &&
           (!categoryFilter || operation.category === categoryFilter);
  });

  const container = document.getElementById("historyOperations");

  container.innerHTML = filtered.length
    ? filtered.map(operation => operationRow(operation, true)).join("")
    : `<div class="empty">Операций не найдено 📭</div>`;
}

function renderAll() {
  const operations = getOperations();

  const incomeTotal = operations
    .filter(operation => operation.type === "income")
    .reduce((sum, operation) => sum + Number(operation.amount), 0);

  const expenseTotal = operations
    .filter(operation => operation.type === "expense")
    .reduce((sum, operation) => sum + Number(operation.amount), 0);

  const balance = incomeTotal - expenseTotal;

  document.getElementById("incomeTotal").textContent = money(incomeTotal);
  document.getElementById("expenseTotal").textContent = money(expenseTotal);

  const balanceBig = document.getElementById("balanceBig");
  balanceBig.textContent = money(balance);
  balanceBig.className = "balance-value " + (balance >= 0 ? "green" : "red");

  document.getElementById("recentOperations").innerHTML = operations.length
    ? operations.slice(0, 10).map(operation => operationRow(operation)).join("")
    : `<div class="empty">Операций пока нет 📭</div>`;

  renderHistory();
  renderChart(operations);
  renderStats("expenseStats", calculateCategoryStats(operations, "expense"));
  renderStats("incomeStats", calculateCategoryStats(operations, "income"));
}

// Реакция на смену системной темы, если Telegram не задал свою
window.matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change", () => {
    if (!tg || !tg.colorScheme) {
      applyTheme();
      renderAll();
    }
  });

fillCategories();
fillHistoryCategories();
renderAll();
</script>
