<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Мой бюджет</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f6f7fb);
    --card: #ffffff;
    --text: var(--tg-theme-text-color, #101828);
    --hint: var(--tg-theme-hint-color, #667085);
    --button: var(--tg-theme-button-color, #4f7cff);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --green: #12b76a;
    --red: #f04438;
    --shadow: 0 8px 24px rgba(16, 24, 40, .08);
    --radius: 20px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --card: #1c1c1e;
      --shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
  }

  .hero {
    background: linear-gradient(135deg, #4f7cff, #8b5cf6);
    color: #fff;
    padding: 22px 18px 74px;
    border-radius: 0 0 28px 28px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .hero-title {
    font-size: 21px;
    font-weight: 800;
  }

  .hero-sub {
    font-size: 13px;
    opacity: .85;
    margin-top: 3px;
  }

  .hero-icon {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,.18);
    border-radius: 14px;
    font-size: 21px;
  }

  .balance-card {
    margin: -52px 14px 16px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }

  .balance-label {
    font-size: 13px;
    color: var(--hint);
  }

  .balance-value {
    font-size: 30px;
    font-weight: 800;
    margin-top: 4px;
  }

  .mini-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }

  .mini-stat {
    background: var(--bg);
    border-radius: 16px;
    padding: 12px;
  }

  .mini-stat-title {
    font-size: 12px;
    color: var(--hint);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mini-stat-value {
    font-size: 17px;
    font-weight: 800;
    margin-top: 5px;
  }

  .app {
    padding: 0 14px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 14px;
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin: 12px 0 6px;
    font-weight: 600;
  }

  input, select, textarea {
    width: 100%;
    min-height: 52px;
    padding: 14px;
    border-radius: 16px;
    border: 1px solid rgba(120,120,128,.22);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--button);
    box-shadow: 0 0 0 3px rgba(79,124,255,.16);
  }

  textarea {
    resize: vertical;
    min-height: 70px;
  }

  .btn {
    width: 100%;
    min-height: 54px;
    margin-top: 14px;
    padding: 15px;
    border: 0;
    border-radius: 18px;
    background: var(--button);
    color: var(--button-text);
    font-size: 16px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .12s ease, opacity .15s ease;
  }

  .btn:active {
    transform: scale(.98);
    opacity: .9;
  }

  .btn.secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid rgba(120,120,128,.22);
  }

  .btn.danger {
    background: rgba(240,68,56,.12);
    color: var(--red);
  }

  .tabs-main {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 6px;
    background: var(--card);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 8px;
    z-index: 30;
  }

  .tab-main {
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 700;
    color: var(--hint);
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }

  .tab-main.active {
    background: var(--button);
    color: var(--button-text);
  }

  .tab-main span {
    display: block;
    font-size: 21px;
    margin-bottom: 2px;
  }

  .page {
    display: none;
    animation: fadeIn .18s ease;
  }

  .page.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .type-tabs {
    display: flex;
    gap: 8px;
    background: var(--bg);
    padding: 6px;
    border-radius: 18px;
    margin-bottom: 6px;
  }

  .type-tab {
    flex: 1;
    text-align: center;
    padding: 13px;
    border-radius: 14px;
    font-weight: 800;
    cursor: pointer;
    color: var(--hint);
    transition: all .15s ease;
  }

  .type-tab.active-expense {
    background: rgba(240,68,56,.14);
    color: var(--red);
  }

  .type-tab.active-income {
    background: rgba(18,183,106,.14);
    color: var(--green);
  }

  .muted {
    color: var(--hint);
    font-size: 12px;
    margin-top: 5px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(120,120,128,.14);
  }

  .stat-row:last-child {
    border-bottom: 0;
  }

  .stat-name {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
  }

  .stat-icon {
    width: 38px;
    height: 38px;
    min-width: 38px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: var(--bg);
    font-size: 18px;
  }

  .progress {
    height: 6px;
    background: var(--bg);
    border-radius: 999px;
    margin-top: 7px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #4f7cff, #8b5cf6);
  }

  .amount {
    white-space: nowrap;
    font-weight: 800;
  }

  .empty {
    color: var(--hint);
    text-align: center;
    padding: 18px 0;
    font-size: 14px;
  }

  .chart-wrap {
    position: relative;
    height: 300px;
  }

  .history-filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }

  .history-filters select {
    min-height: 48px;
    font-size: 14px;
  }

  .op-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(120,120,128,.14);
  }

  .op-row:last-child {
    border-bottom: 0;
  }

  .op-title {
    font-weight: 700;
  }

  .op-comment {
    color: var(--hint);
    font-size: 12px;
    margin-top: 3px;
  }

  .delete-btn {
    border: 0;
    background: rgba(240,68,56,.1);
    color: var(--red);
    width: 36px;
    height: 36px;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
  }

  @media (max-width: 360px) {
    .hero { padding: 18px 14px 68px; }
    .balance-card { margin: -48px 10px 14px; }
    .app { padding: 0 10px; }
    .balance-value { font-size: 27px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <div>
      <div class="hero-title">Мой бюджет 💰</div>
      <div class="hero-sub">Пополнения, расходы и статистика</div>
    </div>
    <div class="hero-icon">📊</div>
  </div>
</div>

<div class="balance-card">
  <div class="balance-label">Доступно сейчас</div>
  <div class="balance-value" id="balanceBig">0 ₽</div>

  <div class="mini-stats">
    <div class="mini-stat">
      <div class="mini-stat-title">📈 Пополнения</div>
      <div class="mini-stat-value green" id="incomeTotal">0 ₽</div>
    </div>

    <div class="mini-stat">
      <div class="mini-stat-title">📉 Расходы</div>
      <div class="mini-stat-value red" id="expenseTotal">0 ₽</div>
    </div>
  </div>
</div>

<div class="app">

  <!-- ГЛАВНАЯ -->
  <div class="page active" id="page-dashboard">

    <div class="card">
      <div class="card-title">🥧 Общая диаграмма</div>
      <div class="chart-wrap">
        <canvas id="mainChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🕘 Последние операции</div>
      <div id="recentOperations"></div>
    </div>

  </div>

  <!-- ДОБАВИТЬ -->
  <div class="page" id="page-add">

    <div class="card">
      <div class="card-title">➕ Новая операция</div>

      <div class="type-tabs">
        <div class="type-tab active-expense" data-type="expense">💸 Расход</div>
        <div class="type-tab" data-type="income">💰 Пополнение</div>
      </div>

      <label>Категория</label>
      <select id="category"></select>

      <label>Сумма, ₽</label>
      <input id="amount" type="number" inputmode="decimal" min="1" step="0.01" placeholder="Например, 1500">

      <label>Комментарий</label>
      <textarea id="comment" placeholder="Например: продукты в Пятёрочке"></textarea>

      <button class="btn" onclick="saveOperation()">
        💾 Сохранить операцию
      </button>

      <button class="btn secondary" onclick="clearForm()">
        🧹 Очистить форму
      </button>
    </div>

  </div>

  <!-- ИСТОРИЯ -->
  <div class="page" id="page-history">

    <div class="card">
      <div class="card-title">📚 История операций</div>

      <div class="history-filters">
        <select id="filterType" onchange="renderHistory()">
          <option value="">Все операции</option>
          <option value="income">Только пополнения</option>
          <option value="expense">Только расходы</option>
        </select>

        <select id="filterCategory" onchange="renderHistory()">
          <option value="">Все категории</option>
        </select>
      </div>

      <div id="historyOperations"></div>
    </div>

  </div>

  <!-- СТАТИСТИКА -->
  <div class="page" id="page-stats">

    <div class="card">
      <div class="card-title">📉 Расходы по категориям</div>
      <div id="expenseStats"></div>
    </div>

    <div class="card">
      <div class="card-title">📈 Пополнения по категориям</div>
      <div id="incomeStats"></div>
    </div>

  </div>

</div>

<div class="tabs-main">
  <div class="tab-main active" data-page="page-dashboard">
    <span>🏠</span>
    Главная
  </div>

  <div class="tab-main" data-page="page-add">
    <span>➕</span>
    Добавить
  </div>

  <div class="tab-main" data-page="page-history">
    <span>📚</span>
    История
  </div>

  <div class="tab-main" data-page="page-stats">
    <span>📊</span>
    Статистика
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
tg.setHeaderColor?.("secondary_bg_color");
tg.setBackgroundColor?.("secondary_bg_color");

const OPERATIONS_KEY = "my_finance_operations_v3";

const expenseCategories = [
  { name: "Продукты", icon: "🛒" },
  { name: "Кафе и рестораны", icon: "🍽️" },
  { name: "Доставка еды", icon: "🛵" },
  { name: "Жильё и аренда", icon: "🏠" },
  { name: "Коммунальные услуги", icon: "💡" },
  { name: "Интернет и связь", icon: "🌐" },
  { name: "Мобильная связь", icon: "📱" },
  { name: "Транспорт", icon: "🚌" },
  { name: "Бензин", icon: "⛽" },
  { name: "Такси", icon: "🚕" },
  { name: "Авто: обслуживание", icon: "🔧" },
  { name: "Авто: страховка", icon: "🛡️" },
  { name: "Одежда", icon: "👕" },
  { name: "Обувь", icon: "👟" },
  { name: "Красота и уход", icon: "💅" },
  { name: "Парикмахерская", icon: "💈" },
  { name: "Косметика", icon: "💄" },
  { name: "Здоровье", icon: "🩺" },
  { name: "Лекарства", icon: "💊" },
  { name: "Стоматология", icon: "🦷" },
  { name: "Спорт и фитнес", icon: "🏋️" },
  { name: "Образование", icon: "🎓" },
  { name: "Курсы", icon: "📚" },
  { name: "Подарки", icon: "🎁" },
  { name: "Цветы", icon: "💐" },
  { name: "Развлечения", icon: "🎉" },
  { name: "Кино", icon: "🎬" },
  { name: "Концерты", icon: "🎤" },
  { name: "Игры", icon: "🎮" },
  { name: "Путешествия", icon: "✈️" },
  { name: "Отпуск", icon: "🏖️" },
  { name: "Отели", icon: "🏨" },
  { name: "Билеты", icon: "🎫" },
  { name: "Подписки", icon: "🔁" },
  { name: "Техника", icon: "💻" },
  { name: "Электроника", icon: "🔌" },
  { name: "Дом и ремонт", icon: "🛠️" },
  { name: "Мебель", icon: "🛋️" },
  { name: "Бытовая техника", icon: "🧺" },
  { name: "Хозяйственные товары", icon: "🧽" },
  { name: "Питомцы", icon: "🐾" },
  { name: "Кредиты", icon: "🏦" },
  { name: "Рассрочка", icon: "💳" },
  { name: "Налоги", icon: "🧾" },
  { name: "Страхование", icon: "📜" },
  { name: "Сбережения", icon: "🐖" },
  { name: "Инвестиции", icon: "📈" },
  { name: "Благотворительность", icon: "❤️" },
  { name: "Прочее", icon: "📦" }
];

const incomeCategories = [
  { name: "Зарплата", icon: "💼" },
  { name: "Аванс", icon: "💵" },
  { name: "Премия", icon: "🏆" },
  { name: "Подработка", icon: "🧰" },
  { name: "Фриланс", icon: "🖥️" },
  { name: "Бизнес", icon: "🏢" },
  { name: "Продажа вещей", icon: "🏷️" },
  { name: "Аренда", icon: "🔑" },
  { name: "Проценты по вкладу", icon: "🏦" },
  { name: "Дивиденды", icon: "📊" },
  { name: "Инвестиции", icon: "📈" },
  { name: "Кэшбэк", icon: "💳" },
  { name: "Подарки", icon: "🎁" },
  { name: "Возврат налога", icon: "🧾" },
  { name: "Социальные выплаты", icon: "🤝" },
  { name: "Пособия", icon: "👶" },
  { name: "Стипендия", icon: "🎓" },
  { name: "Пенсия", icon: "👵" },
  { name: "Прочий доход", icon: "✨" }
];

let currentType = "expense";
let mainChart = null;

function getOperations() {
  try {
    const parsed = JSON.parse(localStorage.getItem(OPERATIONS_KEY));
    return Array.isArray(parsed) ? parsed : [];
  } catch {
    return [];
  }
}

function saveOperations(list) {
  localStorage.setItem(OPERATIONS_KEY, JSON.stringify(list));
}

function getCategory(categoryName) {
  return (
    expenseCategories.find(item => item.name === categoryName) ||
    incomeCategories.find(item => item.name === categoryName) ||
    { name: categoryName, icon: "📦" }
  );
}

function money(value) {
  return Number(value || 0).toLocaleString("ru-RU", {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  }) + " ₽";
}

function fillCategories() {
  const select = document.getElementById("category");
  const list = currentType === "expense" ? expenseCategories : incomeCategories;

  select.innerHTML = list.map(item => {
    return `<option value="${item.name}">${item.icon} ${item.name}</option>`;
  }).join("");
}

function fillHistoryCategories() {
  const select = document.getElementById("filterCategory");
  const selected = select.value;
  const allCategories = [...expenseCategories, ...incomeCategories];

  select.innerHTML = `<option value="">Все категории</option>` + allCategories.map(item => {
    return `<option value="${item.name}">${item.icon} ${item.name}</option>`;
  }).join("");

  select.value = selected;
}

document.querySelectorAll(".type-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".type-tab").forEach(item => {
      item.classList.remove("active-expense", "active-income");
    });

    tab.classList.add(
      tab.dataset.type === "expense" ? "active-expense" : "active-income"
    );

    currentType = tab.dataset.type;
    fillCategories();

    tg.HapticFeedback?.selectionChanged();
  });
});

document.querySelectorAll(".tab-main").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab-main").forEach(item => item.classList.remove("active"));
    tab.classList.add("active");

    document.querySelectorAll(".page").forEach(page => page.classList.remove("active"));
    document.getElementById(tab.dataset.page).classList.add("active");

    window.scrollTo({ top: 0, behavior: "smooth" });
    tg.HapticFeedback?.selectionChanged();
  });
});

function clearForm() {
  document.getElementById("amount").value = "";
  document.getElementById("comment").value = "";
}

function saveOperation() {
  const category = document.getElementById("category").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const comment = document.getElementById("comment").value.trim();

  if (!category) {
    tg.HapticFeedback?.notificationOccurred("error");
    tg.showAlert("Выберите категорию");
    return;
  }

  if (!amount || amount <= 0) {
    tg.HapticFeedback?.notificationOccurred("error");
    tg.showAlert("Введите сумму больше нуля");
    return;
  }

  const operations = getOperations();

  operations.unshift({
    id: Date.now() + Math.random(),
    type: currentType,
    category,
    amount,
    comment,
    created_at: new Date().toISOString()
  });

  saveOperations(operations);
  clearForm();
  renderAll();

  tg.HapticFeedback?.notificationOccurred("success");
  tg.showAlert(
    currentType === "income"
      ? "Пополнение сохранено ✅"
      : "Расход сохранён ✅"
  );
}

function deleteOperation(id) {
  const operations = getOperations().filter(operation => operation.id !== id);
  saveOperations(operations);
  renderAll();

  tg.HapticFeedback?.impactOccurred("light");
}

function calculateCategoryStats(operations, type) {
  const grouped = {};

  operations
    .filter(operation => operation.type === type)
    .forEach(operation => {
      if (!grouped[operation.category]) {
        grouped[operation.category] = {
          category: operation.category,
          total: 0,
          count: 0
        };
      }

      grouped[operation.category].total += Number(operation.amount);
      grouped[operation.category].count += 1;
    });

  const items = Object.values(grouped).sort((a, b) => b.total - a.total);
  const total = items.reduce((sum, item) => sum + item.total, 0);

  return items.map(item => ({
    ...item,
    share: total ? Math.round(item.total / total * 1000) / 10 : 0
  }));
}

function renderStats(containerId, items) {
  const container = document.getElementById(containerId);

  if (!items.length) {
    container.innerHTML = `<div class="empty">Пока нет данных 📭</div>`;
    return;
  }

  const max = items[0].total;

  container.innerHTML = items.map(item => {
    const category = getCategory(item.category);

    return `
      <div class="stat-row">
        <div style="flex:1">
          <div class="stat-name">
            <div class="stat-icon">${category.icon}</div>
            <div>
              ${category.name}
              <div class="muted">${item.count} операций · ${item.share}%</div>
              <div class="progress">
                <div class="progress-bar" style="width:${Math.round(item.total / max * 100)}%"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="amount">${money(item.total)}</div>
      </div>
    `;
  }).join("");
}

function renderChart(operations) {
  const expenseStats = calculateCategoryStats(operations, "expense");
  const incomeStats = calculateCategoryStats(operations, "income");

  const labels = [
    ...expenseStats.map(item => getCategory(item.category).icon + " " + item.category),
    ...incomeStats.map(item => getCategory(item.category).icon + " " + item.category)
  ];

  const values = [
    ...expenseStats.map(item => item.total),
    ...incomeStats.map(item => item.total)
  ];

  const colors = [
    "#f04438", "#4f7cff", "#f79009", "#12b76a", "#8b5cf6",
    "#00b5d8", "#f63d68", "#84cc16", "#f59e0b", "#6366f1",
    "#ec4899", "#14b8a6", "#f97316", "#3b82f6", "#22c55e"
  ];

  const context = document.getElementById("mainChart");

  if (mainChart) {
    mainChart.destroy();
  }

  mainChart = new Chart(context, {
    type: "doughnut",
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: labels.map((_, index) => colors[index % colors.length]),
        borderWidth: 0,
        hoverOffset: 8
      }]
    },
    options: {
      cutout: "62%",
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            boxWidth: 10,
            padding: 9,
            font: { size: 11 }
          }
        }
      }
    }
  });
}

function formatDate(value) {
  const date = new Date(value);

  return date.toLocaleDateString("ru-RU") + ", " +
    date.toLocaleTimeString("ru-RU", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

function operationRow(operation, canDelete = false) {
  const category = getCategory(operation.category);

  return `
    <div class="op-row">
      <div style="display:flex;align-items:center;gap:11px;flex:1">
        <div class="stat-icon">${category.icon}</div>

        <div>
          <div class="op-title">${category.name}</div>
          <div class="op-comment">
            ${operation.comment || "Без комментария"} · ${formatDate(operation.created_at)}
          </div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:8px">
        <div class="amount ${operation.type === "income" ? "green" : "red"}">
          ${operation.type === "income" ? "+" : "−"}${money(operation.amount)}
        </div>

        ${canDelete ? `
          <button class="delete-btn" onclick="deleteOperation(${operation.id})">
            🗑️
          </button>
        ` : ""}
      </div>
    </div>
  `;
}

function renderHistory() {
  const operations = getOperations();
  const typeFilter = document.getElementById("filterType").value;
  const categoryFilter = document.getElementById("filterCategory").value;

  const filtered = operations.filter(operation => {
    return (!typeFilter || operation.type === typeFilter) &&
           (!categoryFilter || operation.category === categoryFilter);
  });

  const container = document.getElementById("historyOperations");

  container.innerHTML = filtered.length
    ? filtered.map(operation => operationRow(operation, true)).join("")
    : `<div class="empty">Операций не найдено 📭</div>`;
}

function renderAll() {
  const operations = getOperations();

  const incomeTotal = operations
    .filter(operation => operation.type === "income")
    .reduce((sum, operation) => sum + Number(operation.amount), 0);

  const expenseTotal = operations
    .filter(operation => operation.type === "expense")
    .reduce((sum, operation) => sum + Number(operation.amount), 0);

  const balance = incomeTotal - expenseTotal;

  document.getElementById("incomeTotal").textContent = money(incomeTotal);
  document.getElementById("expenseTotal").textContent = money(expenseTotal);

  const balanceBig = document.getElementById("balanceBig");
  balanceBig.textContent = money(balance);
  balanceBig.style.color = balance >= 0 ? "var(--green)" : "var(--red)";

  document.getElementById("recentOperations").innerHTML = operations.length
    ? operations.slice(0, 10).map(operation => operationRow(operation)).join("")
    : `<div class="empty">Операций пока нет 📭</div>`;

  renderHistory();
  renderChart(operations);
  renderStats("expenseStats", calculateCategoryStats(operations, "expense"));
  renderStats("incomeStats", calculateCategoryStats(operations, "income"));
}

fillCategories();
fillHistoryCategories();
renderAll();
</script>

</body>
