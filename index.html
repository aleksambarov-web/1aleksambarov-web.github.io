<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Мой бюджет</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --green: #2e7d32;
    --red: #c62828;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
  }

  .app {
    padding: 14px 14px 0;
  }

  h1 {
    font-size: 22px;
    margin: 4px 0 14px;
  }

  h3 {
    margin: 0 0 12px;
    font-size: 17px;
  }

  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 14px;
  }

  .balance-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    font-size: 15px;
  }

  .big-balance {
    font-size: 28px;
    font-weight: 800;
    margin-top: 6px;
  }

  .green { color: var(--green); }
  .red { color: var(--red); }

  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin: 12px 0 6px;
  }

  input, select, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--hint);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }

  textarea {
    resize: vertical;
    min-height: 64px;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  .row > * {
    flex: 1;
  }

  .btn {
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    border: 0;
    border-radius: 16px;
    background: var(--button);
    color: var(--button-text);
    font-size: 16px;
    font-weight: 700;
  }

  .btn.secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--hint);
  }

  .btn.danger {
    background: #c62828;
    color: #fff;
  }

  .tabs-main {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    background: var(--card);
    border-top: 1px solid rgba(128,128,128,.18);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
  }

  .tab-main {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--hint);
    cursor: pointer;
  }

  .tab-main.active {
    background: var(--button);
    color: var(--button-text);
  }

  .tab-main span {
    display: block;
    font-size: 20px;
    margin-bottom: 2px;
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  .type-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }

  .type-tab {
    flex: 1;
    text-align: center;
    padding: 12px;
    border-radius: 14px;
    background: var(--bg);
    font-weight: 700;
    cursor: pointer;
  }

  .type-tab.active {
    background: var(--button);
    color: var(--button-text);
  }

  .draft-item {
    background: var(--bg);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .draft-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-weight: 700;
  }

  .muted {
    color: var(--hint);
    font-size: 12px;
    margin-top: 3px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid rgba(128,128,128,.18);
  }

  .stat-row:last-child {
    border-bottom: 0;
  }

  .amount {
    white-space: nowrap;
    font-weight: 700;
  }

  .empty {
    color: var(--hint);
    text-align: center;
    padding: 14px 0;
    font-size: 14px;
  }

  .chart-wrap {
    position: relative;
    height: 300px;
  }

  .history-filters {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .history-filters select {
    font-size: 14px;
    padding: 11px;
  }

  .op-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid rgba(128,128,128,.18);
  }

  .op-row:last-child {
    border-bottom: 0;
  }

  .op-title {
    font-weight: 600;
  }

  .op-comment {
    color: var(--hint);
    font-size: 12px;
    margin-top: 3px;
  }

  @media (max-width: 360px) {
    .app { padding: 12px 10px 0; }
    .big-balance { font-size: 25px; }
    input, select, textarea { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ГЛАВНАЯ -->
  <div class="page active" id="page-dashboard">
    <h1>Мой бюджет</h1>

    <div class="card">
      <div class="balance-row">
        <span>Доходы</span>
        <b id="incomeTotal" class="green">0 ₽</b>
      </div>

      <div class="balance-row">
        <span>Расходы</span>
        <b id="expenseTotal" class="red">0 ₽</b>
      </div>

      <div class="balance-row">
        <span>Остаток</span>
        <b id="balanceTotal">0 ₽</b>
      </div>

      <div class="big-balance" id="balanceBig">0 ₽</div>
    </div>

    <div class="card">
      <h3>Общая диаграмма</h3>
      <div class="chart-wrap">
        <canvas id="mainChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h3>Последние операции</h3>
      <div id="recentOperations"></div>
    </div>
  </div>

  <!-- ДОБАВИТЬ -->
  <div class="page" id="page-add">
    <h1>Добавить операцию</h1>

    <div class="card">
      <div class="type-tabs">
        <div class="type-tab active" data-type="expense">Расход</div>
        <div class="type-tab" data-type="income">Доход</div>
      </div>

      <label>Категория</label>
      <select id="category"></select>

      <label>Сумма, ₽</label>
      <input id="amount" type="number" inputmode="decimal" min="1" step="0.01" placeholder="Например, 1500">

      <label>Комментарий</label>
      <textarea id="comment" placeholder="Например: продукты в Пятёрочке"></textarea>

      <button class="btn" onclick="addToDraft()">Добавить в черновик</button>
      <button class="btn secondary" onclick="clearForm()">Очистить форму</button>
    </div>

    <div class="card">
      <h3>Черновик</h3>
      <div id="draftList"></div>
      <button class="btn" onclick="saveAllDrafts()">Сохранить всё одной кнопкой</button>
    </div>
  </div>

  <!-- СТАТИСТИКА -->
  <div class="page" id="page-stats">
    <h1>Статистика</h1>

    <div class="card">
      <h3>Расходы по категориям</h3>
      <div id="expenseStats"></div>
    </div>

    <div class="card">
      <h3>Доходы по категориям</h3>
      <div id="incomeStats"></div>
    </div>

    <div class="card">
      <h3>Все операции</h3>
      <div id="allOperations"></div>
    </div>
  </div>

</div>

<!-- НИЖНЕЕ МЕНЮ -->
<div class="tabs-main">
  <div class="tab-main active" data-page="page-dashboard">
    <span>🏠</span>
    Главная
  </div>

  <div class="tab-main" data-page="page-add">
    <span>➕</span>
    Добавить
  </div>

  <div class="tab-main" data-page="page-stats">
    <span>📊</span>
    Статистика
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.setHeaderColor?.("bg_color");
tg.setBackgroundColor?.("bg_color");

const OPERATIONS_KEY = "my_finance_operations_v1";
const DRAFT_KEY = "my_finance_draft_v1";

const expenseCategories = [
  "Продукты", "Кафе и рестораны", "Доставка еды", "Жильё и аренда",
  "Коммунальные услуги", "Интернет и связь", "Мобильная связь",
  "Транспорт", "Бензин", "Такси", "Авто: обслуживание", "Авто: страховка",
  "Одежда", "Обувь", "Красота и уход", "Парикмахерская", "Косметика",
  "Здоровье", "Лекарства", "Стоматология", "Спорт и фитнес",
  "Образование", "Курсы", "Подарки", "Цветы", "Развлечения",
  "Кино", "Концерты", "Игры", "Путешествия", "Отпуск", "Отели",
  "Билеты", "Подписки", "Техника", "Электроника", "Дом и ремонт",
  "Мебель", "Бытовая техника", "Хозяйственные товары", "Питомцы",
  "Кредиты", "Рассрочка", "Налоги", "Страхование", "Сбережения",
  "Инвестиции", "Благотворительность", "Прочее"
];

const incomeCategories = [
  "Зарплата", "Аванс", "Премия", "Подработка", "Фриланс", "Бизнес",
  "Продажа вещей", "Аренда", "Проценты по вкладу", "Дивиденды",
  "Инвестиции", "Кэшбэк", "Подарки", "Возврат налога",
  "Социальные выплаты", "Пособия", "Стипендия", "Пенсия", "Прочий доход"
];

let currentType = "expense";
let mainChart = null;

function getOperations() {
  try {
    return JSON.parse(localStorage.getItem(OPERATIONS_KEY)) || [];
  } catch {
    return [];
  }
}

function saveOperations(list) {
  localStorage.setItem(OPERATIONS_KEY, JSON.stringify(list));
}

function getDraft() {
  try {
    return JSON.parse(localStorage.getItem(DRAFT_KEY)) || [];
  } catch {
    return [];
  }
}

function saveDraft(list) {
  localStorage.setItem(DRAFT_KEY, JSON.stringify(list));
}

function money(value) {
  return Number(value || 0).toLocaleString("ru-RU", {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  }) + " ₽";
}

function fillCategories() {
  const select = document.getElementById("category");
  const list = currentType === "expense" ? expenseCategories : incomeCategories;

  select.innerHTML = list.map(category => {
    return `<option value="${category}">${category}</option>`;
  }).join("");
}

document.querySelectorAll(".type-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".type-tab").forEach(item => item.classList.remove("active"));
    tab.classList.add("active");
    currentType = tab.dataset.type;
    fillCategories();
  });
});

document.querySelectorAll(".tab-main").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab-main").forEach(item => item.classList.remove("active"));
    tab.classList.add("active");

    document.querySelectorAll(".page").forEach(page => page.classList.remove("active"));
    document.getElementById(tab.dataset.page).classList.add("active");

    window.scrollTo({ top: 0, behavior: "smooth" });
  });
});

function clearForm() {
  document.getElementById("amount").value = "";
  document.getElementById("comment").value = "";
}

function addToDraft() {
  const category = document.getElementById("category").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const comment = document.getElementById("comment").value.trim();

  if (!amount || amount <= 0) {
    tg.showAlert("Введите сумму больше нуля");
    return;
  }

  const draft = getDraft();

  draft.unshift({
    id: Date.now() + Math.random(),
    type: currentType,
    category,
    amount,
    comment,
    created_at: new Date().toISOString()
  });

  saveDraft(draft);
  clearForm();
  renderDraft();

  tg.HapticFeedback?.impactOccurred("medium");
  tg.showAlert("Добавлено в черновик");
}

function removeFromDraft(id) {
  saveDraft(getDraft().filter(item => item.id !== id));
  renderDraft();
}

function renderDraft() {
  const draft = getDraft();
  const container = document.getElementById("draftList");

  if (!draft.length) {
    container.innerHTML = `<div class="empty">Черновик пуст</div>`;
    return;
  }

  container.innerHTML = draft.map(item => {
    const label = item.type === "income" ? "Доход" : "Расход";

    return `
      <div class="draft-item">
        <div class="draft-top">
          <div>${label} · ${item.category}</div>
          <div class="amount ${item.type === "income" ? "green" : "red"}">
            ${money(item.amount)}
          </div>
        </div>

        <div class="muted">${item.comment || "Без комментария"}</div>

        <button class="btn danger" style="margin-top:10px" onclick="removeFromDraft(${item.id})">
          Удалить
        </button>
      </div>
    `;
  }).join("");
}

function saveAllDrafts() {
  const draft = getDraft();

  if (!draft.length) {
    tg.showAlert("Черновик пуст");
    return;
  }

  const operations = getOperations();
  const saved = [...draft, ...operations];

  saveOperations(saved);
  saveDraft([]);
  renderDraft();
  renderAll();

  tg.HapticFeedback?.notificationOccurred("success");
  tg.showAlert(`Сохранено операций: ${draft.length}`);
}

function calculateCategoryStats(operations, type) {
  const grouped = {};

  operations
    .filter(operation => operation.type === type)
    .forEach(operation => {
      if (!grouped[operation.category]) {
        grouped[operation.category] = {
          category: operation.category,
          total: 0,
          count: 0
        };
      }

      grouped[operation.category].total += Number(operation.amount);
      grouped[operation.category].count += 1;
    });

  const items = Object.values(grouped).sort((a, b) => b.total - a.total);
  const total = items.reduce((sum, item) => sum + item.total, 0);

  return items.map(item => ({
    ...item,
    share: total ? Math.round(item.total / total * 1000) / 10 : 0
  }));
}

function renderStats(containerId, items) {
  const container = document.getElementById(containerId);

  if (!items.length) {
    container.innerHTML = `<div class="empty">Пока нет данных</div>`;
    return;
  }

  container.innerHTML = items.map(item => `
    <div class="stat-row">
      <div>
        <div>${item.category}</div>
        <div class="muted">${item.count} операций · ${item.share}%</div>
      </div>
      <div class="amount">${money(item.total)}</div>
    </div>
  `).join("");
}

function renderChart(operations) {
  const expenseStats = calculateCategoryStats(operations, "expense");
  const incomeStats = calculateCategoryStats(operations, "income");

  const labels = [
    ...expenseStats.map(item => "Расход: " + item.category),
    ...incomeStats.map(item => "Доход: " + item.category)
  ];

  const values = [
    ...expenseStats.map(item => item.total),
    ...incomeStats.map(item => item.total)
  ];

  const colors = [
    "#ff6384", "#36a2eb", "#ffce56", "#4bc0c0", "#9966ff",
    "#ff9f40", "#8ac24a", "#ea5532", "#00acc1", "#5c6bc0",
    "#d81b60", "#43a047", "#fb8c00", "#3949ab", "#00897b"
  ];

  const context = document.getElementById("mainChart");

  if (mainChart) {
    mainChart.destroy();
  }

  mainChart = new Chart(context, {
    type: "doughnut",
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: labels.map((_, index) => colors[index % colors.length]),
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            boxWidth: 12,
            padding: 8,
            font: { size: 11 }
          }
        }
      }
    }
  });
}

function formatDate(value) {
  const date = new Date(value);

  return date.toLocaleDateString("ru-RU") + " " +
    date.toLocaleTimeString("ru-RU", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

function renderHistory(containerId, operations, limit = null) {
  const container = document.getElementById(containerId);
  const list = limit ? operations.slice(0, limit) : operations;

  if (!list.length) {
    container.innerHTML = `<div class="empty">Операций пока нет</div>`;
    return;
  }

  container.innerHTML = list.map(operation => `
    <div class="op-row">
      <div>
        <div class="op-title">${operation.category}</div>
        <div class="op-comment">
          ${operation.comment || "Без комментария"} · ${formatDate(operation.created_at)}
        </div>
      </div>

      <div class="amount ${operation.type === "income" ? "green" : "red"}">
        ${operation.type === "income" ? "+" : "−"}${money(operation.amount)}
      </div>
    </div>
  `).join("");
}

function renderAll() {
  const operations = getOperations();

  const incomeTotal = operations
    .filter(operation => operation.type === "income")
    .reduce((sum, operation) => sum + Number(operation.amount), 0);

  const expenseTotal = operations
    .filter(operation => operation.type === "expense")
    .reduce((sum, operation) => sum + Number(operation.amount), 0);

  const balance = incomeTotal - expenseTotal;

  document.getElementById("incomeTotal").textContent = money(incomeTotal);
  document.getElementById("expenseTotal").textContent = money(expenseTotal);
  document.getElementById("balanceTotal").textContent = money(balance);

  const balanceBig = document.getElementById("balanceBig");
  balanceBig.textContent = money(balance);
  balanceBig.className = "big-balance " + (balance >= 0 ? "green" : "red");

  renderChart(operations);
  renderHistory("recentOperations", operations, 10);
  renderStats("expenseStats", calculateCategoryStats(operations, "expense"));
  renderStats("incomeStats", calculateCategoryStats(operations, "income"));
  renderHistory("allOperations", operations);
}

fillCategories();
renderDraft();
renderAll();
</script>

</body>
</html>
